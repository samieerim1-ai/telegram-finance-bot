name: Telegram News Bot

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC
    - cron: "30 2 * * *"

    # 1:30 PM IST = 08:00 UTC
    - cron: "0 8 * * *"

    # 6:15 PM IST = 12:45 UTC
    - cron: "45 12 * * *"

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests feedparser

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python bot.py
